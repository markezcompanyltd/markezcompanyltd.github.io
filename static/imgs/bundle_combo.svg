<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">All-in-One Bundle illustration</title>
  <desc id="desc">Stylized electric car and charging station with a bundle ribbon badge.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004a99"/>
      <stop offset="100%" stop-color="#00b894"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad)" />

  <!-- ground -->
  <rect x="0" y="360" width="800" height="90" fill="#ffffff" opacity="0.06" />

  <!-- car (left) -->
  <g transform="translate(80,120)" filter="url(#softShadow)">
    <path d="M40 170 H380 a24 24 0 0 0 24 -24 V110 a32 32 0 0 0 -22 -30 L350 54 a56 56 0 0 0 -46 -4 L160 88 a32 32 0 0 0 -18 14 L100 156 a24 24 0 0 0 24 14z" fill="url(#carGrad)" />
    <path d="M170 90 h160 a20 20 0 0 1 18 12 l10 28 H150 l8 -40 a20 20 0 0 1 12 -20z" fill="#ffffff" opacity="0.14" />
    <circle cx="180" cy="170" r="30" fill="#0b2b4a" />
    <circle cx="340" cy="170" r="30" fill="#0b2b4a" />
    <circle cx="180" cy="170" r="16" fill="#ffffff" opacity="0.06" />
    <circle cx="340" cy="170" r="16" fill="#ffffff" opacity="0.06" />
  </g>

  <!-- charging station (right) -->
  <g transform="translate(470,90)">
    <rect x="0" y="20" width="120" height="200" rx="12" fill="#ffffff" opacity="0.95" />
  <rect x="12" y="36" width="96" height="56" rx="6" fill="#004a99" />
    <rect x="36" y="210" width="48" height="16" rx="4" fill="#0b3d91" />
    <!-- plug -->
    <path d="M92 96 v28 a12 12 0 0 1 -12 12 h-8" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" />
    <rect x="62" y="82" width="16" height="24" rx="3" fill="#ffffff" />
  <text x="18" y="60" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#ffffff" font-weight="800" paint-order="stroke fill" stroke="#000000" stroke-opacity="0.12" stroke-width="0.6">CHARGE</text>
  </g>

  <!-- bundle ribbon badge -->
  <g transform="translate(560,30)">
  <path d="M0 0 h180 v46 l-30 18 l-30 -18 -30 18 -30 -18 v-46 z" fill="#ff9900" stroke="#cc7a00" stroke-width="1" />
  <text x="90" y="30" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#102a43" font-weight="800" text-anchor="middle" paint-order="stroke fill" stroke="#000000" stroke-opacity="0.12" stroke-width="0.6">ALL-IN-ONE</text>
  </g>

  <!-- label -->
  <text x="52" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff" font-weight="700" paint-order="stroke fill" stroke="#000000" stroke-opacity="0.14" stroke-width="0.6">All-in-One Bundle</text>
  <text x="52" y="70" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e6f7ef" paint-order="stroke fill" stroke="#000000" stroke-opacity="0.12" stroke-width="0.4">EV + Charger + Support</text>

</svg>
