<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">EV selection icon</title>
  <desc id="desc">Stylized electric vehicle silhouette with a magnifying glass to indicate selection/search.</desc>
  <defs>
    <linearGradient id="carGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00b894" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ground line -->
  <rect x="0" y="380" width="800" height="70" fill="#f2f4f7" />

  <!-- car body -->
  <g transform="translate(40,80)" filter="url(#shadow)">
    <path d="M80 220 H580 a30 30 0 0 0 30 -30 V150 a40 40 0 0 0 -28 -38 L520 80 a72 72 0 0 0 -60 -6 L200 118 a40 40 0 0 0 -22 18 L140 200 a30 30 0 0 0 30 20z" fill="url(#carGrad)" />

    <!-- windows -->
    <path d="M210 120 h200 a30 30 0 0 1 26 16 l14 36 H180 l10 -52 a30 30 0 0 1 12 -18z" fill="#ffffff" opacity="0.12" />

    <!-- wheel wells -->
    <circle cx="200" cy="260" r="44" fill="#13293d" />
    <circle cx="520" cy="260" r="44" fill="#13293d" />

    <!-- wheels -->
    <circle cx="200" cy="260" r="26" fill="#ffffff" opacity="0.08" />
    <circle cx="520" cy="260" r="26" fill="#ffffff" opacity="0.08" />

    <!-- charging port symbol on hood -->
    <g transform="translate(480,150)" fill="#ffffff" opacity="0.95">
      <rect x="-8" y="-22" width="16" height="26" rx="4" />
      <path d="M0 6 v14" stroke="#00b894" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- magnifying glass (selection/search) -->
  <g transform="translate(520,220)">
    <circle cx="0" cy="0" r="56" fill="#ffffff" stroke="#0b3d91" stroke-width="6" opacity="0.98" />
    <circle cx="-6" cy="-6" r="40" fill="#0b3d91" opacity="0.95" />
    <path d="M38 38 L86 86" stroke="#0b3d91" stroke-width="10" stroke-linecap="round" />

    <!-- small check mark inside magnifier to indicate selection -->
    <path d="M-18 0 L-6 12 L12 -10" stroke="#00e4a1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- label text -->
  <text x="48" y="62" font-family="Segoe UI, Arial, sans-serif" font-size="48" fill="#ffffff" stroke="#000000" stroke-opacity="0.18" stroke-width="1" paint-order="stroke fill" font-weight="900">Choose your EV</text>
  <text x="48" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#ffffff" stroke="#000000" stroke-opacity="0.12" stroke-width="0.8" paint-order="stroke fill">Compare models, range and payment plans</text>

</svg>
